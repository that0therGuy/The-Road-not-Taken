<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Road Not Taken</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/typeit@8.8.7/dist/index.umd.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Walking on a Road</title>

    <link rel="icon" href="resources/mario.gif" type="image/gif"></head>
<body>
<div id="container">
    <div class="h1div">

        <div class="buttons">

            <div class="button sil" data-parallax-layer data-parallax-depth="0.6">
                <div class="imgdiv">

                    <img src="resources/lsd.gif" id="mario" width="75">
                    <p class="click" id="comp">Silicon-Py</p><br>
                </div>

                <div class="prediv">
                    <pre id="compl"> </pre>


                </div>
            </div>
            <div class="button tun">
                <div class="imgdiv">

                    <img src="resources/homer.gif" id="die" width="75">
                    <p class="click" id="acad">Tungsten</p><br>
                </div>

                <div class="prediv">
                    <pre id="acadl"> </pre>

                </div>
            </div>

        </div>
        <div class="h1div2">

            <h1>and You Look<br><span id="road">Behind</span></h1>

        </div>

        <img src="resources/squid.gif" id="what" width="200">
        <div class="buttons">

            <div class="button bau">
                <div class="imgdiv">

                    <img src="resources/birb.gif" id="money" width="75">
                    <p class="click" id="busi">Bauxxite</p><br>
                </div>

                <div class="prediv">
                    <pre id="busil"> </pre>

                </div>
            </div>

            <div class="button aur">
                <div class="imgdiv">

                    <img src="resources/mush.gif" id="mush" width="65">
                    <p class="click" id="spor">Silicon-Js</p><br>
                </div>

                <div class="prediv">
                    <pre id="sporl"> </pre>

                </div>
            </div>
        </div>
    </div>


        <div class="infobox">
            <h2 id="h"></h2>
            <p id="p"></p>
        </div>



</div>


<style>
    h1{
        font-family: 'Astloch';
        margin: 0;
        background: linear-gradient(45deg, rgb(200 127 54), rgb(179 70 66));
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        font-size:6em;
    }

    .infobox{
        opacity:0;
        display:none;
        width:0;
        height:0;
        border:2px solid #9f795c;
        border-radius:7px;
        background: linear-gradient(45deg, rgb(200 115 54 / 0.1) 0%, rgb(179 147 66 / 0.1) 100%);
        transition: all .5s;
        padding:30px;
        font-family: 'astloch', cursive;
        font-size:2em;
        color: #937656;
        font-weight:800;
        text-decoration-inset: 40px;
        text-underline-offset: 10px;
        flex-direction: column;
        gap:20px;
        text-align:center;
        max-height:fit-content !important;
        overflow-y: auto;



    }
    #h,#p{
        margin:0;
        padding:0;
    }
    h1{
        text-align: center;
        transition: all 2s;
    }
    .buttons{


        gap:90px;
    }
    .button{
        display: flex;
        margin:0;
        padding:0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap:15px;
    }
    .h1div{
        display: flex;
        justify-content: center;
        align-items: center;
        gap:100px;
    }
    #what{
        position:absolute;
        top:50%;
        z-index:10;
        transition: all .4s;
    }
    .click{
         transition: all .3s;
         text-decoration:underline;
         text-decoration-inset: 40px;
         text-underline-offset: 20px;

     }
    .click:hover{
        transform: scale(1.02);
        text-decoration-inset: 0;
    }
    #road{
        text-shadow: 0 0 5px #ff865f;

    }
    p{
        font-family:'Fredericka the Great';
        font-weight:bolder;
        margin:10px;
    }
    #compl,#acadl,#busil,#sporl{
        font-size:.5em;
        font-family:'pirata one';

    }
    #comp,#compl{
        color: #8c1a00;
    }
    #acad,#acadl{
        color: #9e4f00;

    }

    #busi,#busil{
        color: #8f564f;
    }
    #spor,#sporl{
        color: #604741;

    }
    .prediv{
        border:1px solid rgb(179 92 66);
        padding:7px;
        border-radius:3px;
        text-align:center;
        width:10em;

    }
    pre{
        margin:0;
        text-wrap: wrap;
        font-family: 'amarante' !important;
        font-weight:100;
    }
    .imgdiv{
        display:flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .scroll{
        margin:0;
        font-size:15px;
        font-family: 'Pirata one';
        background-color:transparent;
        border:none;
        color:rgb(179 92 66);
        letter-spacing: 2px;
    }
    @media screen and (max-width: 1400px) {

        body{
            scale:.9;
        }
    }
    @media screen and (max-width: 1280px) {

        body{
            scale:.8;
        }
    }








</style>

<script>


    let comp= document.querySelector('#comp');
    let acad= document.querySelector('#acad');
    let spor= document.querySelector('#spor');
    let busi= document.querySelector('#busi');



    comp.addEventListener('mouseenter',()=>{
        acad.classList.add('na');
        spor.classList.add('na');
        busi.classList.add('na');

        comp.classList.remove('na');

    })
    comp.addEventListener('mouseleave',()=>{
        comp.classList.remove('na');
        acad.classList.remove('na');
        spor.classList.remove('na');
        busi.classList.remove('na');
    })

    acad.addEventListener('mouseenter',()=>{
        comp.classList.add('na');
        spor.classList.add('na');
        busi.classList.add('na');

        acad.classList.remove('na');

    })
    acad.addEventListener('mouseleave',()=>{
        comp.classList.remove('na');
        acad.classList.remove('na');
        spor.classList.remove('na');
        busi.classList.remove('na');
    })

    busi.addEventListener('mouseenter',()=>{
        acad.classList.add('na');
        spor.classList.add('na');
        comp.classList.add('na');

        busi.classList.remove('na');

    })
    busi.addEventListener('mouseleave',()=>{
        comp.classList.remove('na');
        acad.classList.remove('na');
        spor.classList.remove('na');
        busi.classList.remove('na');
    })

    spor.addEventListener('mouseenter',()=>{
        acad.classList.add('na');
        comp.classList.add('na');
        busi.classList.add('na');

        spor.classList.remove('na');

    })
    spor.addEventListener('mouseleave',()=>{
        comp.classList.remove('na');
        acad.classList.remove('na');
        spor.classList.remove('na');
        busi.classList.remove('na');
    })


    document.getElementById('comp').addEventListener('click',()=>{

        document.getElementById('compl').innerText='';

        new TypeIt("#compl", {
            strings: 'An Aesthetic and Feature-Rich Python Code Editor.',
            speed: 1,
            waitUntilVisible: true,
        }).go();




    })
    document.getElementById('acad').addEventListener('click',()=>{
        document.getElementById('acadl').innerText='';


        new TypeIt("#acadl", {
            strings: 'A Unique Experiment to Push AI to Its Limits via Debating.',
            speed: 1,
            waitUntilVisible: true,
        }).go();




    })
    document.getElementById('spor').addEventListener('click',()=>{

        document.getElementById('sporl').innerText='';

        new TypeIt("#sporl", {
            strings: 'An Aesthetic Javascript Code Editor.',
            speed: 1,
            waitUntilVisible: true,
        }).go();



    })
    document.getElementById('busi').addEventListener('click',()=>{
        document.getElementById('busil').innerText='';


        new TypeIt("#busil", {
            strings: 'A Centralized Place to Store Your Game Keys and Strategize.',
            speed: 1,
            waitUntilVisible: true,
        }).go();




    })

    comp.click()
    busi.click()
    spor.click()
    acad.click()
    comp.onclick=()=>{
        window.open('https://silicon-py.netlify.app',target='_blank');
    }
    acad.onclick=()=>{
        window.open('https://tungsten-ai.netlify.app',target='_blank');
    }
    busi.onclick=()=>{
        window.open('https://bauxxite.netlify.app',target='_blank');
    }
    spor.onclick=()=>{
        window.open('https://silicon-js.netlify.app',target='_blank');
    }


</script>
</body>
</html>
