<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Walking on a Road</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/InertiaPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>

    <link rel="icon" href="resources/mario.gif" type="image/gif">
</head>
<body>
<div id="container">
    <div class="intersectiondiv">
        <a href="left.html" class="button" data-depth="0.2">
            <p class='left' id="0">C</p>
            <p class='left' id="1">o</p>
            <p class='left' id="2">n</p>
            <p class='left' id="3">t</p>
            <p class='left' id="4">a</p>
            <p class='left' id="5">c</p>
            <p class='left' id="6">t</p>
            <p class='left' id="7">s</p>

        </a>


        <h1 style="text-align: center;margin:0; "><span class="eh">You Stumble Upon an</span><br><span id="intersection" ><span class="inters">Inter</span><span class="ection">section</span></span></h1>
        <a href="right.html" class="button">

            <p class='right' id="8">P</p>
            <p class='right' id="9">r</p>
            <p class='right' id="10">o</p>
            <p class='right' id="11">j</p>
            <p class='right' id="12">e</p>
            <p class='right' id="13">c</p>
            <p class='right' id="14">t</p>
            <p class='right' id="15">s</p>



        </a>
    </div>
    <div class="start-sub">



    </div>
    <img id='duck' src="resources/fire2.gif" alt="">

</div>
<style>
    h1 {
        font-family: 'Astloch';
        font-size: clamp(5vw, 2vw, 5rem);
        margin: 0;
        background: linear-gradient(45deg, rgb(200 127 54), rgb(179 70 66));
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
    }
    @media screen and (max-width: 1300px) {

        body{
            scale:.9;
        }
    }
    @media screen and (max-width: 1200px) {

        body{
            scale:.8;
        }
    }


    #duck { 
        width: clamp(80px, 15vw, 70vw);
        height: auto;
    }
    p{
        transition: transform 0.3s;
    }
    #duck{
        position: absolute;
        top:48%;
    }

    #container{
        height:90vh;
    }
    p{
        font-family:'Fredericka the Great';
    }


</style>
<script>
    if (window.innerWidth > 1400) {
        gsap.registerPlugin(SplitText)
        let split = SplitText.create(".inters", { type: "words, chars"  });


        gsap.from(split.chars, {
            duration: 1,
            y: -50,
            autoAlpha: 0,
            stagger: 0.05,
        });
        let split2 = SplitText.create(".ection", { type: "words, chars"  });
        gsap.from(split2.chars, {
            duration: 1,
            y: 50,
            autoAlpha: 0,
            stagger: {
                each: 0.05,
                from: "end"
            }    });
        let split3 = SplitText.create(".eh", { type: "words, chars"  });
        gsap.from(split3.words, {
            duration: 1,
            autoAlpha: 0,
            stagger: 0.05,
        });
    }





    document.querySelectorAll('.left').forEach((el) => {
        let prev_el,next_el = undefined;

        if (el.id > 0) {
            prev_el = parseInt(el.id) - 1
        }
        if (el.id<6){
            next_el= parseInt(el.id)+1
        }
        el.addEventListener('mouseenter', () => {

            el.style.transform = 'translateY(-10px) rotateZ(10deg)';


            if (prev_el){

                document.getElementById(prev_el).style.transform = 'translateY(-5px) rotateZ(-5deg) scale(0.9)';

            }
            if (next_el){
                document.getElementById(next_el).style.transform = 'translateY(-5px) rotateZ(5deg) scale(1.4)';

            }
        })
        el.addEventListener('mouseleave', () => {
            el.style.transform = 'translateY(0px)';

            if (prev_el){
                document.getElementById(prev_el).style.transform = 'translateY(0px)';
                console.log(prev_el)

            }
            if (next_el){
                document.getElementById(next_el).style.transform = 'translateY(0px)';

            }

        })





    })
    document.querySelectorAll('.right').forEach((el) => {
        let prev_el,next_el = undefined;

        if (el.id > 8) {
            prev_el = parseInt(el.id) - 1
        }
        if (el.id<14){
            next_el= parseInt(el.id)+1
        }
        el.addEventListener('mouseenter', () => {

            el.style.transform = 'translateY(-10px) rotateZ(10deg)';


            if (prev_el){

                document.getElementById(prev_el).style.transform = 'translateY(-5px) rotateZ(-5deg) scale(0.9)';

            }
            if (next_el){
                document.getElementById(next_el).style.transform = 'translateY(-5px) rotateZ(5deg) scale(1.4)';

            }
        })
        el.addEventListener('mouseleave', () => {
            el.style.transform = 'translateY(0px)';

            if (prev_el){
                document.getElementById(prev_el).style.transform = 'translateY(0px)';
                console.log(prev_el)

            }
            if (next_el){
                document.getElementById(next_el).style.transform = 'translateY(0px)';

            }

        })





    })
</script>
</body>
</html>
