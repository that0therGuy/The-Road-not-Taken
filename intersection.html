<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Road Not Taken</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="container">
    <div class="intersectiondiv">
        <a onclick="alert('under construction')"  class="button" data-depth="0.2">
            <p class='left' id="0">M</p>
            <p class='left' id="1">y</p>
            <pre class='left' id="2"> </pre>
            <p class='left' id="3">S</p>
            <p class='left' id="4">t</p>
            <p class='left' id="5">o</p>
            <p class='left' id="6">r</p>
            <p class='left' id="7">y</p>

        </a>


        <h1 style="text-align: center;margin:0; ">You have stumbled upon an <br><span id="intersection" >Intersection</span></h1>
        <a href="passions.html" class="button">

            <p class='right' id="8">P</p>
            <p class='right' id="9">a</p>
            <p class='right' id="10">s</p>
            <p class='right' id="11">s</p>
            <p class='right' id="12">i</p>
            <p class='right' id="13">o</p>
            <p class='right' id="14">n</p>
            <p class='right' id="15">s</p>



        </a>
    </div>
    <div class="start-sub">



    </div>
    <img id='duck' src="fire2.gif" alt="">

</div>
<style>
    p{
        transition: transform 0.3s;
    }
    #duck{
        position: absolute;
        top:48%;
    }

    #container{
        height:90vh;
    }
    p{
        font-family:'Fredericka the Great';
    }


</style>
<script>


    document.querySelectorAll('.left').forEach((el) => {
        let prev_el,next_el = undefined;

        if (el.id > 0) {
            prev_el = parseInt(el.id) - 1
        }
        if (el.id<6){
            next_el= parseInt(el.id)+1
        }
        el.addEventListener('mouseenter', () => {

            el.style.transform = 'translateY(-10px) rotateZ(10deg)';


            if (prev_el){

                document.getElementById(prev_el).style.transform = 'translateY(-5px) rotateZ(-5deg) scale(0.9)';

            }
            if (next_el){
                document.getElementById(next_el).style.transform = 'translateY(-5px) rotateZ(5deg) scale(1.4)';

            }
        })
        el.addEventListener('mouseleave', () => {
            el.style.transform = 'translateY(0px)';

            if (prev_el){
                document.getElementById(prev_el).style.transform = 'translateY(0px)';
                console.log(prev_el)

            }
            if (next_el){
                document.getElementById(next_el).style.transform = 'translateY(0px)';

            }

        })





    })
    document.querySelectorAll('.right').forEach((el) => {
        let prev_el,next_el = undefined;

        if (el.id > 8) {
            prev_el = parseInt(el.id) - 1
        }
        if (el.id<14){
            next_el= parseInt(el.id)+1
        }
        el.addEventListener('mouseenter', () => {

            el.style.transform = 'translateY(-10px) rotateZ(10deg)';


            if (prev_el){

                document.getElementById(prev_el).style.transform = 'translateY(-5px) rotateZ(-5deg) scale(0.9)';

            }
            if (next_el){
                document.getElementById(next_el).style.transform = 'translateY(-5px) rotateZ(5deg) scale(1.4)';

            }
        })
        el.addEventListener('mouseleave', () => {
            el.style.transform = 'translateY(0px)';

            if (prev_el){
                document.getElementById(prev_el).style.transform = 'translateY(0px)';
                console.log(prev_el)

            }
            if (next_el){
                document.getElementById(next_el).style.transform = 'translateY(0px)';

            }

        })





    })
</script>
</body>
</html>
